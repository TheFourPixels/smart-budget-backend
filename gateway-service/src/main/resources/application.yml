server:
  port: ${GATEWAY_PORT}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/profile/**

        - id: budget-service
          uri: ${BUDGET_SERVICE_URL}
          predicates:
            - Path=/api/v1/budgets/**, /api/v1/categories/**

        - id: transaction-service
          uri: ${TRANSACTION_SERVICE_URL}
          predicates:
            - Path=/api/v1/transactions/**, /api/v1/rules/**

        - id: goal-service
          uri: ${GOAL_SERVICE_URL}
          predicates:
            - Path=/api/v1/goals/**

        - id: dashboard-service
          uri: ${DASHBOARD_SERVICE_URL}
          predicates:
            - Path=/api/v1/dashboard/**

        - id: bank-service
          uri: ${BANK_SERVICE_URL}
          predicates:
            - Path=/api/v1/bank/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL}
          predicates:
            - Path=/api/v1/notifications/**

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB