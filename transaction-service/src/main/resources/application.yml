server:
  port: 8083

spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:postgresql://db:5432/smartbudget
    username: postgres
    password: 12345
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: true

service:
  budget:
    base-url: ${BUDGET_SERVICE_URL:http://budget-service:8081/api/v1}
  bank:
    base-url: ${BANK_SERVICE_URL:http://bank-service:8085/api/v1}

jwt:
  secret: secret-key
  expiration: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    liquibase: INFO