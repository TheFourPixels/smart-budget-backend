imageRegistry: "progingir"
global:
  imagePullSecrets: []
  env:
    JWT_EXPIRATION: "86400000"
    DB_USER: "postgres"
    DB_NAME: "smartbudget_db"
    S3_URL: "http://smart-budget-minio:9000"
    S3_ACCESS_KEY: "minioadmin"
    S3_BUCKET: "smart-budget-avatars"
    S3_PUBLIC_URL_PREFIX: "http://localhost:9000"

  secretEnv:
    JWT_SECRET:
      secretName: "smart-budget-secrets"
      key: "jwt-secret"
    DB_PASSWORD:
      secretName: "smart-budget-secrets"
      key: "db-password"
    S3_SECRET_KEY:
      secretName: "smart-budget-secrets"
      key: "s3-secret-key"

postgresql:
  enabled: true
  image:
    registry: docker.io
  auth:
    username: postgres
    database: smartbudget_db
    existingSecret: "smart-budget-secrets"
    secretKeys:
      userPasswordKey: "db-password"
      adminPasswordKey: "db-password"

kafka:
  enabled: true
  image:
    registry: docker.io

clickhouse:
  enabled: true

services:
  gateway:
    image:
      repository: "smart-budget-gateway"
      tag: latest
    port: 8080
    env:
      GATEWAY_PORT: "8080"
      AUTH_SERVICE_URL: "http://smart-budget-auth:8089"
      BUDGET_SERVICE_URL: "http://smart-budget-budget:8081"
      TRANSACTION_SERVICE_URL: "http://smart-budget-transaction:8083"
      BANK_SERVICE_URL: "http://smart-budget-bank:8085"
      GOAL_SERVICE_URL: "http://smart-budget-goal:8087"
      DASHBOARD_SERVICE_URL: "http://smart-budget-dashboard:8088"
      NOTIFICATION_SERVICE_URL: "http://smart-budget-notification:8086"
      AUDIT_SERVICE_URL: "http://smart-budget-audit:8090"

  auth:
    image:
      repository: "smart-budget-auth"
      tag: latest
    port: 8089
    env:
      AUTH_PORT: "8089"
      DB_HOST: "smart-budget-postgresql"

  budget:
    image:
      repository: "smart-budget-budget"
      tag: latest
    port: 8081
    env:
      BUDGET_PORT: "8081"
      DB_HOST: "smart-budget-postgresql"
      AUDIT_SERVICE_URL: "http://smart-budget-audit:8090"

  transaction:
    image:
      repository: "smart-budget-transaction"
      tag: latest
    port: 8083
    env:
      TRANSACTION_PORT: "8083"
      DB_HOST: "smart-budget-postgresql"
      AUDIT_SERVICE_URL: "http://smart-budget-audit:8090"

  bank:
    image:
      repository: "smart-budget-bank"
      tag: latest
    port: 8085
    env:
      BANK_PORT: "8085"

  goal:
    image:
      repository: "smart-budget-goal"
      tag: latest
    port: 8087
    env:
      GOAL_PORT: "8087"
      DB_HOST: "smart-budget-postgresql"

  dashboard:
    image:
      repository: "smart-budget-dashboard"
      tag: latest
    port: 8088
    env:
      DASHBOARD_PORT: "8088"
      AUTH_SERVICE_URL: "http://smart-budget-auth:8089"
      BUDGET_SERVICE_URL: "http://smart-budget-budget:8081"
      TRANSACTION_SERVICE_URL: "http://smart-budget-transaction:8083"
      GOAL_SERVICE_URL: "http://smart-budget-goal:8087"

  notification:
    image:
      repository: "smart-budget-notification"
      tag: latest
    port: 8086
    env:
      NOTIFICATION_PORT: "8086"
      KAFKA_BOOTSTRAP_SERVERS: "smart-budget-kafka:9092"
      AUTH_SERVICE_URL: "http://smart-budget-auth:8089"

  audit:
    image:
      repository: "smart-budget-audit"
      tag: latest
    port: 8090
    env:
      AUDIT_PORT: "8090"
      DB_HOST: "smart-budget-postgresql"
      SPRING_CLICKHOUSE_DATASOURCE_JDBC_URL: "jdbc:clickhouse://smart-budget-clickhouse:8123/smartbudget_analytics"
      SPRING_CLICKHOUSE_DATASOURCE_USERNAME: "postgres"

    secretEnv:
      SPRING_CLICKHOUSE_DATASOURCE_PASSWORD:
        secretName: "smart-budget-secrets"
        key: "clickhouse-password"