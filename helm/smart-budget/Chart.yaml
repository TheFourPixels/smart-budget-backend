apiVersion: v2
name: smart-budget
description: A Helm chart for Smart Budget Microservices
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: postgresql
    version: 12.1.9
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: postgresql.enabled
  - name: kafka
    version: 26.8.0
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: kafka.enabled
