server:
  port: ${SERVER_PORT}

spring:
  application:
    name: bank-service
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health, info