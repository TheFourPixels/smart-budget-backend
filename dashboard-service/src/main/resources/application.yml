server:
  port: 8088

spring:
  application:
    name: dashboard-service
  datasource:
    url: jdbc:postgresql://db:5432/smartbudget
    username: postgres
    password: 12345
  jpa:
    enable: false
    show-sql: false
    liquibase:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration

service:
  budget:
    url: http://budget-service:8081/api/v1
  transaction:
    url: http://transaction-service:8083/api/v1
  goal:
    url: http://goal-service:8087/api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info