databaseChangeLog:
  - changeSet:
      id: 1
      author: teamfourpixels
      changes:
        - createTable:
            tableName: budget
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: year
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: month
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: total_income
                  type: decimal(19,2)
                  constraints:
                    nullable: false