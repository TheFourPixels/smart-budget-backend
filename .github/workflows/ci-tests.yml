name: CI & API Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  api_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 and Cache Maven Dependencies
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Project (Quiet Mode)
        run: mvn -B package --file pom.xml -DskipTests -q

      - name: Create .env file
        run: |
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "DB_PASSWORD=12345" >> .env
          echo "DB_USER=postgres" >> .env

      - name: Start Services (DB and Spring Apps)
        run: docker compose up -d --wait

      - name: Install Newman and dependencies
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman Collection via Newman
        run: |
          newman run postman/API-SmartBudget.json \
            --env-var "authBaseUrl=http://localhost:8089/api/v1" \
            --env-var "budgetBaseUrl=http://localhost:8081/api/v1" \
            --env-var "transactionBaseUrl=http://localhost:8083/api/v1" \
            --env-var "goalBaseUrl=http://localhost:8087/api/v1" \
            --env-var "dashboardBaseUrl=http://localhost:8088/api/v1" \
            --reporters cli

      - name: Dump Docker Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Stop Services
        if: always()
        run: docker compose down