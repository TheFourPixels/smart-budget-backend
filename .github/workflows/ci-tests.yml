name: CI & API Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  api_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 and Cache Maven Dependencies
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Project (Quiet Mode)
        run: mvn -B package --file pom.xml -DskipTests -q

      - name: Start Services (DB and Spring Apps)
        run: docker compose up -d --build

      - name: Wait for Budget Service to be healthy (BASH & CURL)
        run: |
          MAX_RETRIES=90
          URL="http://localhost:8082/api/v1/auth/login"
          
          echo "Waiting for Budget Service to start up at $URL..."

          for i in $(seq 1 $MAX_RETRIES); do
            # Проверяем ответ сервера (статус-код 200)
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" $URL)
          
            if [ "$STATUS_CODE" -eq 200 ] || [ "$STATUS_CODE" -eq 401 ]; then
              # Spring Security вернет 401 Unauthorized, если сервис жив,
              # поэтому 401 — это тоже признак успеха.
              echo "✅ Service is UP (Status: $STATUS_CODE) after $i seconds."
              exit 0
            fi
          
            echo "Attempt $i/$MAX_RETRIES: Service not ready (Status: $STATUS_CODE). Waiting 1 second..."
            sleep 1
          done
          
          echo "❌ Timed out after $MAX_RETRIES seconds. Service failed to start."
          exit 1
        shell: bash

      - name: Install Newman and dependencies
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman Collection via Newman
        run: newman run postman/SmartBudget_Collection.json -e postman/CI_CD_Environment.json --reporters cli

      - name: Stop Services
        if: always()
        run: docker compose down
