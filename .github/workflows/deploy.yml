name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./smart-budget-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: smart-budget-backend/pom.xml

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./smart-budget-backend/auth-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-budget-auth:latest

      - name: Build & Push Budget Service
        uses: docker/build-push-action@v5
        with:
          context: ./smart-budget-backend/budget-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-budget-budget:latest

      - name: Build & Push Transaction Service
        uses: docker/build-push-action@v5
        with:
          context: ./smart-budget-backend/transaction-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-budget-transaction:latest

      - name: Build & Push Bank Service
        uses: docker/build-push-action@v5
        with:
          context: ./smart-budget-backend/bank-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-budget-bank:latest

      - name: Build & Push Goal Service
        uses: docker/build-push-action@v5
        with:
          context: ./smart-budget-backend/goal-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-budget-goal:latest

      - name: Build & Push Dashboard Service
        uses: docker/build-push-action@v5
        with:
          context: ./smart-budget-backend/dashboard-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-budget-dashboard:latest

  deploy-to-yandex:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.YC_HOST }}
          username: ${{ secrets.YC_USERNAME }}
          key: ${{ secrets.YC_SSH_KEY }}
          source: "smart-budget-backend/docker-compose.prod.yml"
          target: "/home/${{ secrets.YC_USERNAME }}/app/"

          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.YC_HOST }}
          username: ${{ secrets.YC_USERNAME }}
          key: ${{ secrets.YC_SSH_KEY }}
          script: |
            cd /home/${{ secrets.YC_USERNAME }}/app/
            
            echo "DB_HOST=db" > .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            echo "DB_PORT=5432" >> .env
            
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "JWT_EXPIRATION=${{ secrets.JWT_EXPIRATION }}" >> .env
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
            
            echo "AUTH_PORT=${{ secrets.AUTH_PORT }}" >> .env
            echo "BUDGET_PORT=${{ secrets.BUDGET_PORT }}" >> .env
            echo "TRANSACTION_PORT=${{ secrets.TRANSACTION_PORT }}" >> .env
            echo "BANK_PORT=${{ secrets.BANK_PORT }}" >> .env
            echo "GOAL_PORT=${{ secrets.GOAL_PORT }}" >> .env
            echo "DASHBOARD_PORT=${{ secrets.DASHBOARD_PORT }}" >> .env

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            docker image prune -f