name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: mvn clean install

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-jars
          path: |
            **/target/*.jar
            !**/target/original-*.jar

  build-push-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: built-jars

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-budget-auth:latest

      - name: Build & Push Budget Service
        uses: docker/build-push-action@v5
        with:
          context: ./budget-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-budget-budget:latest

      - name: Build & Push Transaction Service
        uses: docker/build-push-action@v5
        with:
          context: ./transaction-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-budget-transaction:latest

      - name: Build & Push Bank Service
        uses: docker/build-push-action@v5
        with:
          context: ./bank-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-budget-bank:latest

      - name: Build & Push Goal Service
        uses: docker/build-push-action@v5
        with:
          context: ./goal-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-budget-goal:latest

      - name: Build & Push Dashboard Service
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-budget-dashboard:latest

  deploy-to-yandex:
    needs: build-push-docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.YC_HOST }}
          username: ${{ secrets.YC_USERNAME }}
          key: ${{ secrets.YC_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/${{ secrets.YC_USERNAME }}/app/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.YC_HOST }}
          username: ${{ secrets.YC_USERNAME }}
          key: ${{ secrets.YC_SSH_KEY }}
          script: |
            cd /home/${{ secrets.YC_USERNAME }}/app/
            
            echo "DB_USER=${{ secrets.DB_USER }}" > .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f