name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'helm/**' # Защита: пайплайн НЕ запускается, когда Actions сам правит файлы

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Firebase config file
        run: |
          mkdir -p notification-service/src/main/resources
          echo "${{ secrets.FIREBASE_KEY_BASE64 }}" | base64 --decode > notification-service/src/main/resources/firebase-service-account.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-budget-auth:latest

      - name: Build & Push Budget Service
        uses: docker/build-push-action@v5
        with:
          context: ./budget-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-budget-budget:latest

      - name: Build & Push Transaction Service
        uses: docker/build-push-action@v5
        with:
          context: ./transaction-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-budget-transaction:latest

      - name: Build & Push Bank Service
        uses: docker/build-push-action@v5
        with:
          context: ./bank-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-budget-bank:latest

      - name: Build & Push Goal Service
        uses: docker/build-push-action@v5
        with:
          context: ./goal-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-budget-goal:latest

      - name: Build & Push Dashboard Service
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-budget-dashboard:latest

      - name: Build & Push Gateway Service
        uses: docker/build-push-action@v5
        with:
          context: ./gateway-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-budget-gateway:latest

      - name: Build & Push Notification Service
        uses: docker/build-push-action@v5
        with:
          context: ./notification-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-budget-notification:latest

      - name: Build & Push Audit Service
        uses: docker/build-push-action@v5
        with:
          context: ./audit-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-budget-audit:latest

  # Вместо старого деплоя по SSH, добавляем этот автоматический "пинок" для ArgoCD
  deploy-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }} # Твой личный токен Гитхаба (ghp_...)

      # Мы меняем дату в текстовом файлике внутри папки helm.
      # Как только файл в Гитхабе изменится, ArgoCD поймет: «Пора деплоить свежий код!»
      - name: Trigger ArgoCD Sync
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          mkdir -p helm/smart-budget
          echo "Last deploy: $(date)" > helm/smart-budget/deploy-trigger.txt
          git add helm/smart-budget/deploy-trigger.txt
          git commit -m "chore: trigger deployment sync [skip ci]"
          git push